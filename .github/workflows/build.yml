name: Python package

on: [pull_request]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    name: Resolve pyspark versions
    runs-on: ubuntu-latest
    outputs:
      pyspark: ${{ steps.resolve.outputs.pyspark }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        # The pin in requirements-dev.txt is what developers and the pre-commit
        # hook run against, so CI derives its newest leg from it instead of
        # hardcoding a second version that silently drifts away from it.
        run: |
          MIN_SUPPORTED="3.5.8"
          LATEST=$(sed -n 's/^pyspark\(\[[^]]*\]\)\{0,1\}==\(.*\)$/\2/p' requirements-dev.txt)
          if [ -z "${LATEST}" ]; then
            echo "::error::no pinned 'pyspark==' found in requirements-dev.txt"
            exit 1
          fi
          echo "pyspark=[\"${MIN_SUPPORTED}\", \"${LATEST}\"]" >> "$GITHUB_OUTPUT"

  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      # These read the source, not the installed pyspark, so they run once
      # rather than once per matrix leg.
      - name: Style checks
        run: |
          flake8
          bandit typedspark/**/*.py
          black --check .
          isort --check .
          docformatter --black -c **/*.py

  build:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pyspark-version: ${{ fromJSON(needs.versions.outputs.pyspark) }}
        exclude:
          # pyspark 3.5.x does not support Python 3.14
          # (3.5.8 is MIN_SUPPORTED in the versions job above)
          - python-version: "3.14"
            pyspark-version: "3.5.8"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: 21
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        env:
          PYSPARK_VERSION: ${{ matrix.pyspark-version }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install "pyspark[connect]==${PYSPARK_VERSION}"
      - name: Start Spark Connect
        if: ${{ startsWith(matrix.pyspark-version, '4.') }}
        run: |
          # The pyspark wheel ships bin/spark-submit and the spark-connect jar,
          # so the Connect server runs straight from the pip install. No Apache
          # tarball needed: dlcdn only carries current releases and the
          # archive.apache.org fallback took ~10 minutes per job.
          SPARK_HOME=$(python -c "import os, pyspark; print(os.path.dirname(pyspark.__file__))")
          echo "SPARK_HOME=$SPARK_HOME" >> "$GITHUB_ENV"
          nohup "${SPARK_HOME}/bin/spark-submit" \
            --class org.apache.spark.sql.connect.service.SparkConnectServer \
            --name "Spark Connect server" \
            --conf spark.ui.enabled=false \
            --conf spark.ui.showConsoleProgress=false \
            > spark-connect.log 2>&1 &
          python - <<'PY'
          import pathlib
          import socket
          import time

          for _ in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 15002), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              log = pathlib.Path("spark-connect.log")
              if log.exists():
                  print(log.read_text())
              raise SystemExit("Spark Connect server did not start on port 15002")
          PY
      # mypy, pyright and pylint resolve against the installed pyspark, so they
      # run on every leg: a typing regression against one pyspark version is
      # exactly what typedspark exists to catch. Style checks live in the
      # `style` job above.
      - name: Type checks
        run: |
          mypy .
          pyright .
          pylint typedspark
      - name: Testing
        env:
          SPARK_CONNECT_URL: ${{ startsWith(matrix.pyspark-version, '4.') && 'sc://localhost:15002' || '' }}
        run: |
          # we run this test seperately, to ensure that it is run without an active Spark session
          python -m pytest -m no_spark_session

          # likewise for Spark Connect: typedspark dispatches on the active session,
          # so a local session in the same process shadows the remote one
          if [ -n "${SPARK_CONNECT_URL}" ]; then
            python -m pytest -m spark_connect
          fi

          coverage run -m pytest -m "not spark_connect"
          coverage report -m --fail-under 100
      - name: Run notebooks
        if: ${{ startsWith(matrix.pyspark-version, '4.') }}
        run: python docs/run_notebooks.py docs/*/*.ipynb
